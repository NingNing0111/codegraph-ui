[package]
name = "codegraph-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
open = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
