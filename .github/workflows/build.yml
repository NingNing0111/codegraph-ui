name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: codegraph-ui-aarch64-apple-darwin
            binary: codegraph-ui
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: codegraph-ui-x86_64-apple-darwin
            binary: codegraph-ui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: codegraph-ui-x86_64-pc-windows-msvc
            binary: codegraph-ui.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
